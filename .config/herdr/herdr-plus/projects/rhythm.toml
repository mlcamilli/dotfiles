# herdr-plus project — pick it from the Projects browser (prefix+Up) or
# `herdr-plus open rhythm`. Creates a workspace rooted at working_dir.
name = "rhythm"
description = "rhythm-app"
working_dir = "~/dev/rhythm-app"

[[tabs]]
name = "rhythm"

[[tabs.panes]]
label = "editor"
command = "nvim"

[[tabs.panes]]
label = "claude"
command = "claude"
split = "right"
ratio = 0.5

[[tabs.panes]]
label = "shell"
split = "down"
ratio = 0.5
