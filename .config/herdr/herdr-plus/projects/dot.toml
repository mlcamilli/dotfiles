# herdr-plus project — pick it from the Projects browser (prefix+Up) or
# `herdr-plus open dot`. Creates a workspace rooted at working_dir.
name = "dot"
description = "dotfiles"
working_dir = "~/dev/dotfiles"

[[tabs]]
name = "dot"

[[tabs.panes]]
label = "editor"
command = "nvim"

[[tabs.panes]]
label = "claude"
command = "claude"
split = "right"
ratio = 0.5

[[tabs.panes]]
label = "shell"
split = "down"
ratio = 0.5
